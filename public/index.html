<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Мессенджер</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    background: #0e1621;
    color: #e4e6eb;
    overflow: hidden;
    user-select: none;
  }

  input, textarea, button { font-family: inherit; }

  /* ===== ЭКРАНЫ ===== */
  .screen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
  }
  .screen.active { display: flex; }

  /* ===== ЭКРАН АВТОРИЗАЦИИ ===== */
  #auth {
    background: linear-gradient(160deg, #17212b 0%, #0e1621 100%);
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-y: auto;
  }

  .auth-box {
    width: 100%;
    max-width: 400px;
    background: #17212b;
    border-radius: 18px;
    padding: 32px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }

  .logo {
    text-align: center;
    font-size: 56px;
    margin-bottom: 8px;
  }
  .title {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    font-size: 14px;
    color: #7a8a9a;
    margin-bottom: 28px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: #0e1621;
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: #7a8a9a;
    border-radius: 9px;
    cursor: pointer;
    transition: .2s;
    background: transparent;
    border: none;
  }
  .tab.active { background: #2b5278; color: #fff; }

  .input-group { margin-bottom: 14px; }
  .input-group label {
    display: block;
    font-size: 13px;
    color: #7a8a9a;
    margin-bottom: 6px;
    padding-left: 4px;
  }
  .input-group input {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    background: #0e1621;
    border: 2px solid transparent;
    border-radius: 12px;
    color: #fff;
    outline: none;
    transition: .2s;
  }
  .input-group input:focus { border-color: #2b5278; background: #101a25; }

  .btn-primary {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(180deg, #3a6ea5, #2b5278);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 8px;
    transition: .15s;
    box-shadow: 0 4px 12px rgba(43,82,120,.4);
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

  .error {
    color: #ff6b6b;
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
    min-height: 20px;
  }

  /* ===== ГЛАВНЫЙ ЭКРАН ===== */
  #main {
    background: #0e1621;
  }

  .topbar {
    display: flex;
    align-items: center;
    height: 56px;
    padding: 0 12px;
    background: #17212b;
    border-bottom: 1px solid #0e1621;
    flex-shrink: 0;
  }
  .topbar-title {
    flex: 1;
    font-size: 18px;
    font-weight: 700;
    padding-left: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .topbar-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: #7a8a9a;
    font-size: 22px;
    cursor: pointer;
    border-radius: 50%;
    transition: .15s;
  }
  .topbar-btn:hover { background: rgba(255,255,255,.05); color: #fff; }

  /* ===== СПИСОК ЧАТОВ ===== */
  .chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .chat-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    transition: .15s;
    gap: 12px;
  }
  .chat-item:hover { background: #17212b; }
  .chat-item.active { background: #2b5278; }

  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3a6ea5, #2b5278);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    position: relative;
    text-transform: uppercase;
  }
  .online-dot {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 13px;
    height: 13px;
    background: #4dc76d;
    border: 2px solid #17212b;
    border-radius: 50%;
  }

  .chat-info { flex: 1; min-width: 0; }
  .chat-name {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 3px;
    text-transform: capitalize;
  }
  .chat-last {
    font-size: 14px;
    color: #7a8a9a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    text-align: center;
    color: #4a5a6a;
    padding: 60px 20px;
    font-size: 15px;
  }

  /* ===== ОКНО ЧАТА ===== */
  #chatScreen {
    position: fixed;
    inset: 0;
    background: #0e1621;
    display: none;
    flex-direction: column;
    z-index: 10;
  }
  #chatScreen.active { display: flex; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 12px 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background-image: radial-gradient(circle at 20% 30%, rgba(43,82,120,.08) 0%, transparent 50%),
                      radial-gradient(circle at 80% 70%, rgba(58,110,165,.06) 0%, transparent 50%);
  }

  .msg {
    max-width: 78%;
    padding: 8px 12px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.35;
    word-wrap: break-word;
    animation: msgIn .15s ease;
    position: relative;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.out {
    align-self: flex-end;
    background: linear-gradient(180deg, #3a6ea5, #2b5278);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.in {
    align-self: flex-start;
    background: #17212b;
    color: #e4e6eb;
    border-bottom-left-radius: 4px;
  }
  .msg-time {
    font-size: 11px;
    opacity: .65;
    margin-left: 8px;
    float: right;
    margin-top: 4px;
  }

  .day-divider {
    align-self: center;
    font-size: 12px;
    color: #7a8a9a;
    background: rgba(23,33,43,.8);
    padding: 3px 12px;
    border-radius: 10px;
    margin: 8px 0;
  }

  .typing-indicator {
    font-size: 13px;
    color: #7a8a9a;
    padding: 0 16px 4px;
    height: 18px;
    font-style: italic;
  }

  .input-bar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 12px;
    background: #17212b;
    border-top: 1px solid #0e1621;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }

  .input-bar textarea {
    flex: 1;
    padding: 10px 14px;
    font-size: 16px;
    background: #0e1621;
    border: none;
    border-radius: 20px;
    color: #fff;
    outline: none;
    resize: none;
    max-height: 120px;
    min-height: 40px;
    line-height: 20px;
    font-family: inherit;
  }

  .send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3a6ea5, #2b5278);
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: .15s;
  }
  .send-btn:active { transform: scale(.92); }
  .send-btn:disabled { opacity: .4; }

  /* ===== МОБИЛЬНОЕ ===== */
  @media (max-width: 600px) {
    .auth-box { padding: 24px 20px; }
    .msg { max-width: 85%; font-size: 15px; }
  }

  /* Скроллбар */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a4a5a; }
</style>
</head>
<body>

<!-- ========== ЭКРАН АВТОРИЗАЦИИ ========== -->
<div class="screen active" id="auth">
  <div class="auth-box">
    <div class="logo">💬</div>
    <div class="title">Мессенджер</div>
    <div class="subtitle">Общайся с кем угодно</div>

    <div class="tabs">
      <button class="tab active" id="tabLogin">Вход</button>
      <button class="tab" id="tabRegister">Регистрация</button>
    </div>

    <form id="authForm" autocomplete="on">
      <div class="input-group">
        <label>Имя пользователя</label>
        <input type="text" id="username" placeholder="например: ivan_2024"
               autocomplete="username" required>
      </div>
      <div class="input-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="минимум 4 символа"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="authSubmit">Войти</button>
      <div class="error" id="authError"></div>
    </form>
  </div>
</div>

<!-- ========== ГЛАВНЫЙ ЭКРАН (список чатов) ========== -->
<div class="screen" id="main">
  <div class="topbar">
    <div class="topbar-title">💬 Мессенджер</div>
    <button class="topbar-btn" id="logoutBtn" title="Выйти">⏻</button>
  </div>
  <div class="chat-list" id="chatList">
    <div class="empty">Нет других пользователей.<br>Позови друзей!</div>
  </div>
</div>

<!-- ========== ЭКРАН ЧАТА ========== -->
<div id="chatScreen">
  <div class="topbar">
    <button class="topbar-btn" id="backBtn">←</button>
    <div class="avatar" id="chatAvatar" style="width:36px;height:36px;font-size:15px;margin-right:8px;">?</div>
    <div class="topbar-title" id="chatTitle" style="padding-left:0;">Чат</div>
    <button class="topbar-btn" id="refreshBtn" title="Обновить">⟳</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="typing-indicator" id="typingIndicator"></div>
  <div class="input-bar">
    <textarea id="messageInput" placeholder="Написать сообщение…" rows="1"></textarea>
    <button class="send-btn" id="sendBtn" disabled>➤</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
